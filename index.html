<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador Inteligente de NCM</title>
    <!-- Script oficial do Tailwind para rodar direto do GitHub Pages -->
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen text-gray-800">

    <div class="container mx-auto px-4 py-8 max-w-2xl">
        <!-- Cabeçalho -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">🔍 Validador & Buscador NCM</h1>
            <p class="text-gray-600 text-sm">Consulte códigos NCM, alíquotas de IPI e ICMS-PR instantaneamente para Embalagens, Máquinas e Utilitários.</p>
        </div>

        <!-- Barra de Busca -->
        <div class="bg-white p-6 rounded-xl shadow-md border border-gray-200 mb-6">
            <label for="searchInput" class="block text-sm font-medium text-gray-700 mb-2">Digite o código NCM (8 dígitos) ou o nome do produto:</label>
            <input type="text" id="searchInput" placeholder="Ex: 48191000 ou Caixa de papelão" 
                   class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none transition-all">
        </div>

        <!-- Área de Resultados -->
        <div id="resultContainer" class="bg-white p-6 rounded-xl shadow-md border border-gray-200 hidden">
            <!-- Os resultados vão aparecer aqui via JavaScript -->
        </div>
        
        <div id="emptyState" class="text-center py-8 text-gray-400 text-sm border-2 border-dashed border-gray-200 rounded-xl bg-slate-50">
            A aplicação está pronta. Digite algo acima para iniciar a consulta.
        </div>
    </div>

    <script>
        // Banco de dados inicial focado nos seus 3 pilares de consultoria B2B
        const ncmDatabase = [
            { codigo: "4819.10.00", produto: "Caixas de papelão ondulado (Embalagens Personalizadas)", ipi: "0%", icms_pr: "19%" },
            { codigo: "3923.21.00", produto: "Sacos e sacolas de plástico de polímeros de etileno", ipi: "5%", icms_pr: "19%" },
            { codigo: "8438.10.00", produto: "Máquinas e aparelhos para panificação ou pastelaria industrial", ipi: "0%", icms_pr: "12%" },
            { codigo: "7321.11.00", produto: "Fogões de cozinha a gás domésticos/industriais", ipi: "4%", icms_pr: "19%" },
            { codigo: "8704.21.90", produto: "Veículos automóveis utilitários (Furgões/Carga inferior a 5t)", ipi: "8%", icms_pr: "12%" }
        ];

        const searchInput = document.getElementById('searchInput');
        const resultContainer = document.getElementById('resultContainer');
        const emptyState = document.getElementById('emptyState');

        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase().replace(/\./g, '').trim();

            if (term.length < 2) {
                resultContainer.classList.add('hidden');
                emptyState.classList.remove('hidden');
                emptyState.innerText = "Digite pelo menos 2 caracteres para pesquisar...";
                return;
            }

            const filtrados = ncmDatabase.filter(item => {
                const codigoLimpo = item.codigo.replace(/\./g, '');
                return codigoLimpo.includes(term) || item.produto.toLowerCase().includes(term);
            });

            if (filtrados.length > 0) {
                emptyState.classList.add('hidden');
                resultContainer.classList.remove('hidden');
                
                let htmlContent = <h2 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-4">Registros Encontrados (${filtrados.length}):</h2>;
                
                filtrados.forEach(item => {
                    htmlContent += `
                        <div class="border-b border-gray-100 py-4 last:border-0 last:pb-0 first:pt-0">
                            <div class="flex justify-betwee
